<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a623"/>
      <stop offset="100%" style="stop-color:#e8821a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Wristband / chip card -->
  <rect x="116" y="150" width="280" height="212" rx="28" fill="#1a1c24"/>
  <rect x="116" y="150" width="280" height="212" rx="28" fill="none" stroke="#2c2f3a" stroke-width="2"/>
  <!-- RFID chip -->
  <rect x="150" y="196" width="78" height="60" rx="10" fill="#f5d77a"/>
  <path d="M150 226 h78 M189 196 v60" stroke="#1a1c24" stroke-width="6"/>
  <!-- contactless waves -->
  <g fill="none" stroke="#f5a623" stroke-width="12" stroke-linecap="round">
    <path d="M276 200 a40 40 0 0 1 0 56"/>
    <path d="M300 184 a72 72 0 0 1 0 88"/>
  </g>
  <!-- check mark -->
  <path d="M168 300 l34 34 l72 -78" fill="none" stroke="#4ad07a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

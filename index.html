<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Festival">
<meta name="description" content="Anleitungen, Referenz & Fallnotizen für Festival-Crews (Cashless-Clearing, Dienstpläne u. a.).">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Festival</title>
</head>
<body>
<div class="app" id="app">
  <main class="screens">
    <section class="screen active" id="screen-guides"></section>
    <section class="screen" id="screen-notes"></section>
    <section class="screen" id="screen-reference"></section>
    <section class="screen" id="screen-dienstplan"></section>
    <section class="screen" id="screen-bestand"></section>
    <section class="screen" id="screen-lineup"></section>
    <section class="screen" id="screen-klangpiraten"></section>
    <section class="screen" id="screen-more"></section>
  </main>

  <nav class="nav">
    <button id="nav-guides" class="active" onclick="showScreen('guides')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span>Anleitungen</span>
    </button>
    <button id="nav-lineup" onclick="showScreen('lineup')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>Line-Up</span>
    </button>
    <button id="nav-reference" onclick="showScreen('reference')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>Referenz</span>
    </button>
    <button id="nav-dienstplan" onclick="showScreen('dienstplan')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Dienstplan</span>
    </button>
    <button id="nav-klangpiraten" onclick="showScreen('klangpiraten')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      <span>Klangp.</span>
    </button>
    <button id="nav-more" onclick="showScreen('more')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>Mehr</span>
    </button>
  </nav>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
